name: Release

# A merge to main that changes deployable files (code/ or .distignore) creates
# the next version tag and a GitHub release with code/ zipped as razorpay/.
# Docs- or workflow-only merges make no release (and so no deploy).
# Patch bump by default; the merged PR's `release:minor` or `release:major`
# label bumps those instead.

on:
  push:
    branches:
      - main
    paths:
      - 'code/**'
      - '.distignore'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_DIR_NAME: razorpay

    steps:
      - name: Check out main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Work out next version
        id: version
        run: |
          set -euo pipefail

          if git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            echo "Commit already released as $(git tag --points-at "$GITHUB_SHA" | grep '^v' | head -1)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
          bump=patch
          if grep -qx 'release:major' <<<"$labels"; then bump=major
          elif grep -qx 'release:minor' <<<"$labels"; then bump=minor
          fi

          # Only strict vMAJOR.MINOR.PATCH tags count; anything else is ignored.
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            case "$bump" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              patch) next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          echo "Last tag: ${last:-none}, bump: $bump, next: $next"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        if: steps.version.outputs.skip == 'false'
        id: build
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          tag="$NEXT_TAG"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/$PACKAGE_DIR_NAME"

          rsync --archive --exclude-from='.distignore' code/ "$stage/$PACKAGE_DIR_NAME/"
          test -f "$stage/$PACKAGE_DIR_NAME/pay.php"
          test ! -e "$stage/$PACKAGE_DIR_NAME/config.php"
          # Allow-list: only PHP files and .htaccess may ship; no symlinks.
          if find "$stage" -type l | grep -q .; then echo "::error::symlink in package"; exit 1; fi
          unexpected=$(find "$stage/$PACKAGE_DIR_NAME" -type f ! -name '*.php' ! -name '.htaccess' -print)
          if [ -n "$unexpected" ]; then echo "::error::unexpected files in package:"; echo "$unexpected"; exit 1; fi

          zip_name="razorpay-resellerclub-gateway-${tag}.zip"
          (cd "$stage" && zip -r -q "$GITHUB_WORKSPACE/$zip_name" "$PACKAGE_DIR_NAME")
          unzip -l "$zip_name"
          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          NEXT_TAG: ${{ steps.version.outputs.tag }}
          ZIP_NAME: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          [[ "$NEXT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag $NEXT_TAG"; exit 1; }
          gh release create "$NEXT_TAG" "$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "$NEXT_TAG" \
            --generate-notes
