name: Deploy

# Uploads code/ (filtered by .distignore) to the server set in the FTP_* repo settings
# over explicit FTPS (FTP with TLS forced) after each successful release on main.
#
# Automatic deploys only run while the repo variable DEPLOY_ENABLED is 'true'.
# A manual run always checks the connection; it uploads only when
# DEPLOY_ENABLED is 'true' and the "deploy" input is ticked.
#
# Repo variables: DEPLOY_ENABLED, FTP_PORT, FTP_REMOTE_PATH,
#                 FTP_SSL_VERIFY (optional, default 'true')
# Repo secrets:   FTP_HOST, FTP_USERNAME, FTP_PASSWORD (masked in the public logs)
#
# Uploads never delete remote files, so config.php and data/ on the server
# are left alone.

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload files after the connection check (also needs DEPLOY_ENABLED=true).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_PORT: ${{ vars.FTP_PORT || '21' }}
  FTP_REMOTE_PATH: ${{ vars.FTP_REMOTE_PATH || '/' }}
  FTP_SSL_VERIFY: ${{ vars.FTP_SSL_VERIFY || 'true' }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Verify settings
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          # These values are interpolated into lftp commands: accept only safe shapes.
          [[ "$FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::FTP_HOST must be a plain hostname"; missing=1; }
          [[ "$FTP_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::FTP_PORT must be a number"; missing=1; }
          [[ "$FTP_REMOTE_PATH" =~ ^/[A-Za-z0-9._/-]*$ ]] || { echo "::error::FTP_REMOTE_PATH must be an absolute path of letters, digits, . _ - /"; missing=1; }
          [[ "$FTP_SSL_VERIFY" == "true" || "$FTP_SSL_VERIFY" == "false" ]] || { echo "::error::FTP_SSL_VERIFY must be true or false"; missing=1; }
          if [ "$FTP_SSL_VERIFY" = "false" ]; then echo "::warning::FTP_SSL_VERIFY=false: the server certificate is not verified"; fi
          exit $missing

      - name: Verify connection and destination
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          parent=$(dirname "$FTP_REMOTE_PATH")
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "ftp://${FTP_HOST}:${FTP_PORT}" <<EOF
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate $FTP_SSL_VERIFY
          cd "$parent"
          cls -1
          bye
          EOF

      - name: Stage files
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/razorpay"
          mkdir -p "$stage"
          rsync --archive --exclude-from='.distignore' code/ "$stage/"
          test -f "$stage/pay.php"
          test -f "$stage/.htaccess"
          test ! -e "$stage/config.php"
          # Allow-list: only PHP files and .htaccess may be uploaded; no symlinks.
          if find "$stage" -type l | grep -q .; then echo "::error::symlink in upload"; exit 1; fi
          unexpected=$(find "$stage" -type f ! -name '*.php' ! -name '.htaccess' -print)
          if [ -n "$unexpected" ]; then echo "::error::unexpected files in upload:"; echo "$unexpected"; exit 1; fi
          find "$stage" -type f -print | sort

      - name: Upload files
        if: >-
          vars.DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_run' || inputs.deploy == true)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "ftp://${FTP_HOST}:${FTP_PORT}" <<EOF
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate $FTP_SSL_VERIFY
          mkdir -p -f "$FTP_REMOTE_PATH"
          mirror --reverse --verbose=1 --no-perms "$RUNNER_TEMP/razorpay" "$FTP_REMOTE_PATH"
          bye
          EOF
