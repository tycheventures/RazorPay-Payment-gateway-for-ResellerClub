name: Deploy to pay.fenixhost.in

# Uploads code/ (filtered by .distignore) to https://pay.fenixhost.in/razorpay
# over explicit FTPS (FTP with TLS forced) after each successful release on main.
#
# Automatic deploys only run while the repo variable DEPLOY_ENABLED is 'true'.
# A manual run always checks the connection; it uploads only when
# DEPLOY_ENABLED is 'true' and the "deploy" input is ticked.
#
# Repo variables: DEPLOY_ENABLED, FTP_HOST, FTP_PORT, FTP_REMOTE_PATH,
#                 FTP_SSL_VERIFY (optional, default 'true')
# Repo secrets:   FTP_USERNAME, FTP_PASSWORD
#
# Uploads never delete remote files, so config.php and data/ on the server
# are left alone.

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload files after the connection check (also needs DEPLOY_ENABLED=true).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FTP_HOST: ${{ vars.FTP_HOST }}
  FTP_PORT: ${{ vars.FTP_PORT || '21' }}
  FTP_REMOTE_PATH: ${{ vars.FTP_REMOTE_PATH || '/' }}
  FTP_SSL_VERIFY: ${{ vars.FTP_SSL_VERIFY || 'true' }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Verify settings
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

      - name: Verify connection and destination
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          parent=$(dirname "$FTP_REMOTE_PATH")
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "ftp://${FTP_HOST}:${FTP_PORT}" <<EOF
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate $FTP_SSL_VERIFY
          cd "$parent"
          cls -1
          bye
          EOF

      - name: Stage files
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/razorpay"
          mkdir -p "$stage"
          rsync --archive --exclude-from='.distignore' code/ "$stage/"
          test -f "$stage/pay.php"
          test -f "$stage/.htaccess"
          test ! -e "$stage/config.php"
          find "$stage" -type f -print | sort

      - name: Upload files
        if: >-
          vars.DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_run' || inputs.deploy == true)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          LFTP_PASSWORD="$FTP_PASSWORD" lftp --env-password -u "$FTP_USERNAME" "ftp://${FTP_HOST}:${FTP_PORT}" <<EOF
          set cmd:fail-exit true
          set net:timeout 30
          set net:max-retries 2
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate $FTP_SSL_VERIFY
          mkdir -p -f "$FTP_REMOTE_PATH"
          mirror --reverse --verbose=1 --no-perms "$RUNNER_TEMP/razorpay" "$FTP_REMOTE_PATH"
          bye
          EOF
